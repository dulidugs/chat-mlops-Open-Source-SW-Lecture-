name: Deploy to Local Machine

on:
  workflow_run:
    workflows: ["Build and Push Docker Image"] # 앞서 작성한 ci.yml의 workflow name
    types:
      - completed

jobs:
  deploy:
    runs-on: self-hosted
    
    # 이전 CI 워크플로우(빌드 및 푸시)가 성공했을 때만 실행되도록 설정
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Pull latest image
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/chat-mlops-api:latest

      - name: Stop existing container
        # 기존 컨테이너가 없어도 실패하지 않도록 || true 추가
        run: docker stop chat-mlops-container || true

      - name: Remove existing container
        run: docker rm chat-mlops-container || true

      - name: Run new container
        run: |
          docker run -d \
            --name chat-mlops-container \
            -p 8000:8000 \
            --restart unless-stopped \
            ${{ secrets.DOCKERHUB_USERNAME }}/chat-mlops-api:latest
